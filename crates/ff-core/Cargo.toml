[package]
name = "ff-core"
description = "Sift 引擎核心：索引数据结构 · 查询解析 · 求值 · 评分 · 持久化格式（纯逻辑）"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Track B 按 DESIGN.md §2.1 清单添加，版本已核对 docs.rs / crates.io：
# - ff-match（path）：T1 子串匹配器 + arena 并行扫描（DESIGN §3 允许的依赖方向）。
# - rayon 1.12（MIT OR Apache-2.0）：AND 候选集并行校验。
# - rustc-hash 2.1（MIT OR Apache-2.0）：FRN → EntryId 表（FxHashMap，不落盘）。
ff-match = { path = "../ff-match" }
rayon = "1.12"
rustc-hash = "2.1"
# serde（M3/M6 IPC 必需）：Tauri invoke 经 JSON 序列化 ff-engine::api 契约类型。
# 纯 Rust、无 unsafe，与 #![forbid(unsafe_code)] 一致；已在 docs/DEPENDENCIES.md 登记。
serde = { version = "1", features = ["derive"] }
# regex 1.x（MIT OR Apache-2.0）：DESIGN §7.2 的 regex: 修饰符（明确允许，
# "先用 regex 默认，不引入 fancy-regex"）。无 unsafe，与 forbid(unsafe_code) 一致。
regex = "1"
