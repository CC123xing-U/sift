# - ff-match（path）：T1 子串匹配器 + arena 并行扫描（DESIGN §3 允许的依赖方向）。
# - rayon 1.12（MIT OR Apache-2.0）：AND 候选集并行校验。
# - rustc-hash 2.1（MIT OR Apache-2.0）：FRN → EntryId 表（FxHashMap，不落盘）。
ff-match = { path = "../ff-match" }
rayon = "1.12"
rustc-hash = "2.1"
