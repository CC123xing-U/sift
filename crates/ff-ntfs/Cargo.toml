[package]
name = "ff-ntfs"
description = "Sift NTFS 卷读取：MFT 全量扫描 + USN 增量（封装 ntfs-reader / windows）"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Track A 添加（M0）。版本已对照 docs.rs / crates.io 2026-10-24 确认：
# - ntfs-reader 0.6.0（2026-10-01 发布，MSRV 1.88.0，本地工具链 1.97.1 满足）：
#   MFT 全量/流式扫描 + USN Journal，MIT OR Apache-2.0。
# - windows 0.62：Win32 绑定（卷枚举 / USN Journal FSCTL / 进程内存），MIT OR Apache-2.0。
#   feature 按所用模块最小化勾选；ntfs-reader 自身还会带上 Foundation/Security/IO/FileSystem/Ioctl。
# - rustc-hash 2.1：FxHash（DESIGN §2.1 清单内），FRN 集合与父计数用，MIT OR Apache-2.0。
# - time 0.3：ntfs-reader 的时间戳返回 OffsetDateTime，转回 FILETIME（契约单位）用，MIT OR Apache-2.0。
ntfs-reader = "0.6.0"
rustc-hash = "2.1"
time = "0.3"
# serde（M3/M6 IPC 必需）：VolumeId 随 ff-engine::api 契约类型经 Tauri invoke 序列化。
serde = { version = "1", features = ["derive"] }
# tracing 0.1（DESIGN §2.1 准入）：USN 跳过的 V3/未知版本记录、解析中断要按 §5.3 记日志。
# 库只依赖 tracing；订阅者（tracing-subscriber）归上层 app / ff-service，不在这里引入。
tracing = "0.1"

[target."cfg(windows)".dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
]
