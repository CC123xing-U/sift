[package]
name = "ff-engine"
description = "Sift 引擎：卷管理 · Base+Overlay · 后台合并 · 落盘调度 · 对外 EngineClient 实现"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
ff-core = { path = "../ff-core" }
ff-match = { path = "../ff-match" }
ff-ntfs = { path = "../ff-ntfs" }
rustc-hash = "2.1"
# serde（M3/M6 IPC 必需）：EngineClient 契约类型经 Tauri invoke 序列化给 UI。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
