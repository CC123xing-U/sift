[package]
name = "sift-bench"
description = "Sift 合成数据生成器 + criterion 基准（DESIGN §14，Track D 所有）"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
ff-core = { path = "../crates/ff-core" }
# windows：仅 memprobe 的 GetProcessMemoryInfo 使用（DESIGN §1.3 内存实测）。
# 版本按 docs.rs 当前最新 0.62.2 锁定（DESIGN §2.1 只规定用 `windows` crate，未规定版本范围）。
# 许可证：MIT OR Apache-2.0（与 windows crate 一致）。
windows = { version = "0.62", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
# criterion 0.8（docs.rs 最新 0.8.2，2026-02-04；Apache-2.0 OR MIT）。
criterion = "0.8"

[[bench]]
name = "build_index"
harness = false

[[bench]]
name = "search_bench"
harness = false
